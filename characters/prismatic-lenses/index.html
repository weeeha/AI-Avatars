<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Prismatic lenses — character states · AI Avatars</title><link rel="stylesheet" href="../../assets/preview.css"><link rel="stylesheet" href="index.css"></head>
<body><main class="page"><nav class="page-nav" aria-label="Gallery navigation"><a href="../../index.html">← AI Avatars</a><span class="page-title">Prismatic lenses — character states</span></nav>
<div id="prismatic-dots" aria-label="SuperClock animated lens study">
  <div class="pd-modes viz-row" role="group" aria-label="Assistant status">
    <button type="button" class="btn" data-mode="idle" aria-pressed="false">Idle</button>
    <button type="button" class="btn" data-mode="listening" aria-pressed="false">Listening</button>
    <button type="button" class="btn" data-mode="talking" aria-pressed="true">Talking</button>
    <button type="button" class="btn" data-mode="thinking" aria-pressed="false">Thinking</button>
    <button type="button" class="btn" data-mode="coding" aria-pressed="false">Writing code</button>
    <button type="button" class="btn" data-mode="complete" aria-pressed="false">Complete</button>
  </div>
  <div class="pd-stage">
    <canvas role="img" aria-label="A fixed grid of circular glass lenses with flowing teal, coral and magenta light">Animated circular lenses.</canvas>
    <p class="pd-error" role="alert" hidden></p>
  </div>
  <div class="pd-caption"><span data-detail aria-live="polite">Talking · syllabic pulses</span><button type="button" class="btn btn-ghost" data-demo aria-pressed="false">Demo sequence</button></div>
  <div class="pd-toolbar">
    <div class="viz-row" role="group" aria-label="Visual style">
      <button type="button" class="btn" data-look="aurora" aria-pressed="false">Prismatic</button>
      <button type="button" class="btn" data-look="pink" aria-pressed="true">Pink ripple</button>
      <button type="button" class="btn" data-look="cyan" aria-pressed="false">Cyan ripple</button>
      <button type="button" class="btn" data-look="lilac" aria-pressed="false">Lilac</button>
      <button type="button" class="btn" data-look="amber" aria-pressed="false">Amber</button>
      <button type="button" class="btn" data-look="mint" aria-pressed="false">Mint</button>
    </div>
    <button type="button" class="btn btn-ghost" data-play aria-label="Pause animation">Pause</button>
  </div>
  <div class="pd-settings">
    <label class="form-label" for="pd-speed"><span class="pd-speed-label">Motion <output class="tabular-nums" for="pd-speed">1.05×</output></span><input id="pd-speed" class="form-range" type="range" min="0.25" max="1.75" step="0.05" value="1.05"></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-round checked><span class="form-check-label">Round display</span></label>
  </div>
  <span class="sr-only" data-status aria-live="polite"></span>
</div>
</main><script src="../../assets/preview-state.js"></script><script src="index.js"></script></body></html>
