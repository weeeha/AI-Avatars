        <optgroup label="Emotions">

          <option value="curious">Curious</option>
          <option value="happy">Happy</option>
          <option value="delighted">Delighted</option>
          <option value="surprised">Surprised</option>
          <option value="sleepy">Sleepy</option>
          <option value="annoyed">Annoyed</option>
          <option value="sad">Sad</option>
        </optgroup>
        <optgroup label="Clock states">
          <option value="listening">Listening</option>
          <option value="thinking">Thinking</option>
          <option value="speaking">Speaking</option>
          <option value="focus">Focus</option>
          <option value="time">Time</option>
          <option value="alarm">Alarm</option>

    </label>
    <label class="form-label">Emotion<select class="form-select" id="oracle-emotion" aria-label="Emotion"></select></label>

    <button class="btn" id="oracle-pause" type="button">Pause</button>
    <button class="btn" id="oracle-next" type="button">Next state</button>
    <button class="btn" id="oracle-blink" type="button">Blink</button>
  </div>
  <div class="oracle-stage">
    <div class="oracle-face">
      <canvas id="oracle-canvas" width="768" height="768" role="img" aria-label="An expressive white statue clock with three shimmering black eyes. Choose an emotion or clock state to change its eyelids, lips and luminous eye symbols."></canvas>
      <div class="oracle-clock" aria-hidden="true"></div>
    </div>
  </div>
  <div class="text-small text-muted text-center" id="oracle-status" aria-live="polite">Resting · stars and slow blinks</div>
  <div id="oracle-error" role="alert" hidden></div>
</div>
<style>
#oracle-alive .viz-controls{margin-bottom:14px}
#oracle-alive .oracle-stage{display:grid;place-items:center;padding:4px 0 16px}
#oracle-alive .oracle-face{position:relative;width:min(100%,540px);aspect-ratio:1;container-type:inline-size}
#oracle-alive canvas{display:block;width:100%;height:100%;border-radius:50%}
#oracle-alive .oracle-clock{position:absolute;left:50.64%;top:29.75%;transform:translate(-50%,-50%);color:#fff;font:400 5.7cqw/1.1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.045em;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none;text-shadow:0 0 8px #ffffff24}

    const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const photo=new Image();photo.src='assets/oracle-source.jpg';
    photo.onload=()=>{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,photo);ready=true;};
    photo.onerror=()=>fail('The statue image could not load.');
    const pulse=(elapsed,duration)=>elapsed>=0&&elapsed<duration?Math.pow(Math.sin(Math.PI*elapsed/duration),1.45):0;
    draw=(dt)=>{
      active=mode==='demo'?order[(Math.floor(time/4.8)+demoOffset)%order.length]:mode;
      if(active!==renderedState)stateSince=time;
      const age=Math.max(0,time-stateSince);
      let target=JSON.parse(JSON.stringify(presets[active]));
      const entry=Math.max(0,Math.sin(Math.min(1,age/2)*Math.PI));
      if(active==='starting'){target.lid=[Math.max(0,1-age/1.1),Math.max(0,1-(age-.18)/1.2),Math.max(0,1-(age-.3)/1.2)];target.gaze=[0,.18*Math.max(0,1-age/1.5)];}
      if(active==='researching'){const row=(age%3)/3;target.gaze=[-.24+.48*(row*3%1),-.08+.10*Math.floor(row*3)];target.asym=8*Math.sin(age*2);}
      if(active==='working'||active==='coding'){const coding=active==='coding',step=Math.floor(age*(coding?3.2:1.4));target.gaze=[Math.sin(step*2.1)*.13,.16+.025*Math.sin(age*2)];target.lid[0]+=.10*Math.pow(Math.max(0,Math.sin(age*2.5)),5);target.asym+=Math.sin(age*(coding?5:2))*(coding?5:2);}
      if(active==='checking'){target.gaze=[Math.sin(Math.floor(age*1.3)*Math.PI/2)*.22,-.035];target.open[1]+=.06*Math.sin(age*3);target.open[2]-=.06*Math.sin(age*3);}
      if(active==='waiting'){target.gaze=[.12*entry,0];target.lid=target.lid.map(v=>v+.12*entry);}
      if(['needs-input','awaiting-approval'].includes(active)){target.tilt[0]+=.10*entry;target.gaze=[.1*entry,-.03];target.open[0]+=.13*entry;}
      if(active==='complete'){target.size+=.14*entry;target.smile+=10*entry;if(age>2.8)target={...JSON.parse(JSON.stringify(presets.resting)),label:presets.complete.label};}
      if(active==='error'){target.gaze=[Math.sin(age*10)*.14*entry,0];target.open=target.open.map(v=>v+.10*entry);}
      if(active==='reconnecting'){target.gaze=[Math.sin(age*1.8)*.14,Math.cos(age*1.8)*.04];}
      if(reaction&&time-reaction.at>2.8)reaction=null;
      const selected=reaction?.id||(emotion==='auto'?null:emotion==='neutral'?'resting':emotion);
      if(selected&&active!=='sleeping'){
        const expression=presets[selected];const weight=reaction?Math.sin(Math.min(1,(time-reaction.at)/2.8)*Math.PI):.72;
        for(const key of ['smile','asym','width','gap'])target[key]+=(expression[key]-target[key])*weight;
        for(const key of ['open','lid','tilt'])target[key]=target[key].map((v,i)=>v+(expression[key][i]-v)*weight);
        if(weight>.35&&active!=='alarm'&&active!=='time'){target.glyph=expression.glyph;target.size+=(expression.size-target.size)*weight;}
      }
      if((selected==='playful'||active==='playful')&&active!=='sleeping')target.lid[2]=Math.max(target.lid[2],pulse(time%4-.5,.8));
      if(active==='sleeping'){target.lid=[1,1,1];target.gap=0;}
      const targetLabel=presets[active].label+(selected?' · '+selected:'');
      const easing=dirty&&paused?1:1.-Math.exp(-dt*5.5);
      if(dirty||active!==renderedState||status.textContent!==targetLabel){
        status.textContent=targetLabel;
        renderedState=active;
      }
      for(const key of ['smile','asym','width','gap','size','shimmer','speed','brightness'])pose[key]+=(target[key]-pose[key])*easing;
      for(const key of ['open','lid','tilt','gaze'])for(let i=0;i<pose[key].length;i++)pose[key][i]+=(target[key][i]-pose[key][i])*easing;
      if(target.glyph!==glyphTo){glyphFrom=glyphBlend<.5?glyphFrom:glyphTo;glyphTo=target.glyph;glyphBlend=0;}
      glyphBlend+=(1-glyphBlend)*easing;
      timeFade+=(Number(active==='time')-timeFade)*easing;
      speechFade+=(Number(active==='speaking')-speechFade)*easing;
      const manual=pulse(performance.now()/1000-blinkStart,.46);
      const slow=time%9.1;
      const b1=pose.lid[0]+(1-pose.lid[0])*Math.max(manual,pulse(slow-5.4,.57));
      const b2=pose.lid[1]+(1-pose.lid[1])*Math.max(manual,pulse(slow-2.6,.42),pulse(slow-7.35,.4));
      const b3=pose.lid[2]+(1-pose.lid[2])*Math.max(manual,pulse(slow-2.67,.44),pulse(slow-7.44,.41));
      const phrase=Math.pow(.5+.5*Math.sin(time*1.13),.8);
      const syllable=.18+.47*Math.pow(.5+.5*Math.sin(time*8.4),2)+.35*Math.pow(.5+.5*Math.sin(time*13.1+.8),3);
      const opening=pose.gap*(.94+.06*Math.sin(time*1.8))+speechFade*(2.+26.*phrase*syllable);
      gl.viewport(0,0,canvas.width,canvas.height);
      gl.uniform1f(uniforms.t,time);
      gl.uniform3f(uniforms.blink,b1,b2,b3);
      gl.uniform1f(uniforms.mouth,opening);
      gl.uniform1f(uniforms.showingTime,timeFade);
      gl.uniform3fv(uniforms.openness,pose.open);
      gl.uniform3fv(uniforms.tilts,pose.tilt);
      gl.uniform3f(uniforms.lips,pose.smile,pose.asym,pose.width);
      gl.uniform4f(uniforms.stars,pose.size,pose.shimmer,pose.speed,pose.brightness);
      gl.uniform3f(uniforms.glyphs,glyphFrom,glyphTo,glyphBlend);
      gl.uniform2fv(uniforms.gaze,pose.gaze);
      gl.drawArrays(gl.TRIANGLES,0,6);
      clock.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
      clock.style.opacity=timeFade*(1-b1);
      clock.style.transform='translate(-50%,-50%) scaleY('+(1-b1*.9)+')';
      canvas.dataset.state=active;canvas.dataset.ready='true';canvas.dataset.time=time.toFixed(3);
      dirty=false;
    }
    function frame(now){
      const dt=Math.min((now-last)/1000||0,.1);last=now;
      if(reduce.matches!==lastReduced){lastReduced=reduce.matches;if(lastReduced)setPaused(true);}
      if(!paused&&!document.hidden)time+=dt;
      if(ready&&!document.hidden&&(!paused||dirty||now/1000-blinkStart<.6))draw(paused?0:dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    window.oraclePreview={setMode,setEmotion,setPaused,react,seek:(seconds)=>{time=seconds;stateSince=0;renderedState=mode==='demo'?renderedState:mode;dirty=true;draw(1);},getState:()=>({mode,active,emotion,reaction:reaction?.id||null,paused,time,ready,timeFade,speechFade,glyphFrom,glyphTo,glyphBlend,pose}),capture:()=>canvas.toDataURL('image/png')};
    addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.modelContent?.mode;if(allowed.includes(next)){mode=next;modeControl.value=mode;dirty=true;}});
    reduce.addEventListener('change',event=>{lastReduced=event.matches;if(event.matches)setPaused(true);});
  }catch(e){fail(e.message);}
})();
